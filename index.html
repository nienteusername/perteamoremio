<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ciao Fio 💙</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Georgia, serif;

      color: #104d9e;

      background: linear-gradient(
        135deg,
        #dff0ff,
        #c9e3ff,
        #edf7ff
      );
    }

    .app {
      width: min(1000px, 94%);
      min-height: calc(100vh - 56px);

      margin: 28px auto;
      padding: 55px clamp(20px, 5vw, 65px);

      border: 1px solid rgba(255,255,255,.85);
      border-radius: 32px;

      background: rgba(255,255,255,.43);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow: 0 20px 60px rgba(40,100,170,.16);
    }

    .screen {
      display: none;

      animation: comparsa .4s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes comparsa {

      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: clamp(58px, 9vw, 95px);

      font-weight: 400;
      font-style: italic;
    }

    .heart {
      color: #398df4;
    }

    .subtitle {

      margin: 18px 0 42px;

      text-align: center;

      font-family: Arial, sans-serif;

      font-size: 17px;
    }

    .menu {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 18px;

      max-width: 760px;

      margin: auto;
    }

    button {

      -webkit-tap-highlight-color: transparent;
    }

    .card,
    .love,
    .back,
    .footer-button {

      border: 1px solid rgba(255,255,255,.9);

      background: rgba(255,255,255,.48);

      box-shadow: 0 12px 35px rgba(45,105,180,.13);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      color: #104d9e;

      cursor: pointer;
    }

    .card {

      min-height: 165px;

      border-radius: 25px;

      font-family: Georgia, serif;

      font-size: 25px;

      transition: .25s;
    }

    .card:hover {

      transform: translateY(-6px);

      background: rgba(255,255,255,.68);

      box-shadow: 0 20px 45px rgba(45,105,180,.2);
    }

    .card:active {

      transform: scale(.98);
    }

    .tile-icon {

      display: block;

      width: 42px;
      height: 42px;

      margin: 0 auto 15px;
    }

    .tile-icon svg {

      width: 100%;
      height: 100%;

      fill: none;

      stroke: #398df4;

      stroke-width: 2.2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer-button {

      display: block;

      min-width: 180px;

      margin: 34px auto 0;

      padding: 15px 30px;

      border-radius: 17px;

      font-family: Arial, sans-serif;

      font-size: 17px;

      font-style: italic;

      transition: .2s;
    }

    .footer-button:hover {

      transform: translateY(-3px);

      background: rgba(255,255,255,.72);
    }

    .footer-button:active {

      transform: scale(.97);
    }

    .detail-head {

      position: relative;

      margin-bottom: 25px;

      text-align: center;
    }

    .detail-head h2 {

      margin: 10px;

      font-size: 46px;

      font-weight: 400;
    }

    .back {

      position: absolute;

      top: 0;
      left: 0;

      padding: 10px 16px;

      border-radius: 14px;

      font-family: Arial, sans-serif;

      transition: .2s;
    }

    .back:hover {

      background: rgba(255,255,255,.72);
    }

    .message {

      max-width: 800px;

      margin: auto;

      padding: 35px;

      border-radius: 27px;

      background: rgba(255,255,255,.48);

      border: 1px solid rgba(255,255,255,.85);

      box-shadow: 0 15px 45px rgba(45,105,180,.12);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      font-family: Arial, sans-serif;

      font-size: 17px;

      line-height: 1.8;

      color: #174d9c;
    }

    .message strong {

      color: #104d9e;

      font-weight: 700;
    }

    .love {

      display: block;

      min-width: 220px;

      margin: 28px auto 0;

      padding: 14px 24px;

      border-radius: 18px;

      font-family: Arial, sans-serif;

      font-size: 15px;

      font-weight: bold;

      transition: .2s;
    }

    .love:hover {

      transform: translateY(-3px);

      background: rgba(255,255,255,.72);
    }

    .love:active {

      transform: scale(.97);
    }

    @media (max-width: 650px) {

      .app {

        width: 96%;

        min-height: calc(100vh - 16px);

        margin: 8px auto;

        padding: 35px 18px;

        border-radius: 25px;
      }

      .menu {

        grid-template-columns: 1fr;
      }

      .card {

        min-height: 130px;
      }

      .back {

        position: static;

        margin-bottom: 18px;
      }

      .detail-head h2 {

        font-size: 38px;
      }

      .message {

        padding: 24px;

        font-size: 16px;
      }

    }

  </style>

</head>


<body>


<main class="app">


  <!-- HOME -->

  <section id="home" class="screen active">

    <h1>
      Ciao Fio <span class="heart">💙</span>
    </h1>

    <div class="subtitle">
      per te, amore. Utilizza questo per quando...
    </div>


    <div class="menu">


      <!-- SEI TRISTE -->

      <button
        type="button"
        class="card"
        onclick="showPage('triste')"
      >

        <span class="tile-icon">

          <svg viewBox="0 0 48 48">

            <path
              d="M12 31h24a8 8 0 0 0 0-16
              12 12 0 0 0-22.7 3
              A7 7 0 0 0 12 31Z"
            />

          </svg>

        </span>

        sei triste

      </button>


      <!-- TI MANCO DI PIÙ -->

      <button
        type="button"
        class="card"
        onclick="showPage('manco')"
      >

        <span class="tile-icon">

          <svg viewBox="0 0 48 48">

            <path d="M8 13h32v23H8z"/>

            <path d="m9 15 15 12 15-12"/>

            <path d="m9 35 11-10"/>

            <path d="M39 35 28 25"/>

          </svg>

        </span>

        ti manco di più

      </button>


      <!-- SEI ARRABBIATA -->

      <button
        type="button"
        class="card"
        onclick="showPage('arrabbiata')"
      >

        <span class="tile-icon">

          <svg viewBox="0 0 48 48">

            <path d="M26 5 10 27h12l-2 16 18-24H26z"/>

          </svg>

        </span>

        sei arrabbiata

      </button>


      <!-- TI SENTI SOLA -->

      <button
        type="button"
        class="card"
        onclick="showPage('sola')"
      >

        <span class="tile-icon">

          <svg viewBox="0 0 48 48">

            <circle cx="17" cy="16" r="6"/>

            <circle cx="31" cy="18" r="5"/>

            <path
              d="M7 37c0-7 4-11 10-11
              s10 4 10 11"
            />

            <path
              d="M24 37c0-5 3-9 8-9
              5 0 9 4 9 9"
            />

          </svg>

        </span>

        ti senti sola

      </button>

    </div>


    <!-- DATA -->

    <button
      type="button"
      class="footer-button"
      onclick="showPage('extra')"
    >
      01/09/2026
    </button>

  </section>



  <!-- SCHERMATA SECONDARIA -->

  <section
    id="detail"
    class="screen"
  >

  </section>


</main>



<script>


/* ==========================================
   CONTENUTI DELLE QUATTRO SITUAZIONI
   ========================================== */


const contenuti = {


  triste: {

    titolo: "sei triste",

    testo: `

      <p>
        Ciao Amore.
      </p>

      <p>
        Se stai leggendo questo significa che sei triste.
        Mi dispiace che tu stia così, ma ricordati che ogni cosa passa, sempre.
      </p>

      <p>
        È normale stare male a volte, ma non devi per forza
        affrontare tutto da sola, perciò se hai bisogno puoi
        scrivermi e magari riesco ad aiutarti più nello specifico.
      </p>

      <p>
        Non stare giù, prova a pensare a qualcosa di bello
        che ti rende felice, ricordati che ci sono sempre.
      </p>

    `
  },


  manco: {

    titolo: "ti manco di più",

    testo: `

      <p>
        Ciao Amore.
      </p>

      <p>
        Inizio col dirti che sono sicuro che in questo momento
        mi manchi anche tu e che ti penso sempre.
      </p>

      <p>
        Mi dispiace se in questo momento magari non ci sono,
        ma ti prometto che appena potrò staremo tutto il tempo
        che vuoi insieme.
      </p>

      <p>
        Ricordati però che anche se non ci sono ti porto con me
        nel mio cuoricino, e anche io sono sempre con te.
      </p>

    `
  },


  arrabbiata: {

    titolo: "sei arrabbiata",

    testo: `

      <p>
        Ciao Amore.
      </p>

      <p>
        A volte succede di innervosirsi e di far prendere
        alla rabbia il sopravvento.
      </p>

      <p>
        Come prima cosa se sei agitata prova a utilizzare
        il 4-7-8, ossia inspira dal naso per 4 secondi,
        trattieni il fiato per 7 e butta fuori lentamente
        dalla bocca per 8 secondi.
      </p>

      <p>
        Non so se questa cosa può aiutarti ma prova.
      </p>

      <p>
        Ricordati anche che innervosirsi è normale, e serve
        un po anche al nostro corpo per sfogarsi, quindi
        prenditi tutto il tempo che ti serve e ricordati
        che sono qui.
      </p>

    `
  },


  sola: {

    titolo: "ti senti sola",

    testo: `

      <p>
        Ciao Amore.
      </p>

      <p>
        Sentirsi soli è molto brutta come cosa, e mi dispiace
        il non poterci essere fisicamente nemmeno io a causa
        della distanza.
      </p>

      <p>
        Ricordati però, che se hai bisogno di una persona a cui
        raccontare una qualsiasi cosa io ci sono sempre, se hai
        bisogno di sfogarti sono qua.
      </p>

      <p>
        <strong>
          Non sei e non sarai mai sola per davvero Fio
        </strong>
      </p>

    `
  }

};



/* ==========================================
   MOSTRA UNA PAGINA
   ========================================== */


function showPage(id) {


  const home = document.getElementById("home");

  const detail = document.getElementById("detail");


  /* Nasconde la home */

  home.classList.remove("active");


  /* Cancella il contenuto precedente */

  detail.innerHTML = "";


  /* ========================================
     PAGINA 01/09/2026
     ======================================== */


  if (id === "extra") {


    detail.innerHTML = `

      <div class="detail-head">

        <button
          type="button"
          class="back"
          onclick="goHome()"
        >
          ← Indietro
        </button>

        <h2>
          CIAO AMORE!
        </h2>

      </div>


      <div class="message">

        <p>
          CIAO AMORE.
          Oggi è il primo settembre, nonchè data di nascita
          della mia bellissima fidanzata, quindi come prima cosa,
          <strong>TANTI AUGURI AMORE MIOO.</strong>
        </p>

        <p>
          14 anni sono un'età "importante", e sono contento
          che la mia bimba stia diventando una bimba grande,
          sempre più speciale.
        </p>

        <p>
          So che in questo momento magari sarai un po confusa,
          quindi ti spiego meglio: questo è il mio regalo di
          compleanno per te che, anche se non è molto,
          ci tenevo a fare.
        </p>

        <p>
          Ho creato questo sito totalmente a mano, e adesso
          ti chiederai "e io che cazzo me ne faccio" ecco,
          in verità la mia idea iniziale era di crearti delle
          lettere per i vari momenti di "difficoltà" che potresti
          avere, ma dato che non so di preciso dove vivi,
          non avrei avuto modo di spedirtele, così mi è venuto
          (stranamente) un lampo di genio, che mi ha fatto venire
          l'idea di fare questo sito, che in breve ha le stesse
          funzioni della lettera.
        </p>

        <p>
          Quando ti sentirai in uno dei modi descritti nei 4
          pulsanti sopra a questo, potrai cliccarlo e ti sbucherà
          un testo per ogni situazione, che spero possa nel mio
          piccolo aiutarti.
        </p>

        <p>
          Ah, un altra cosa, tu eri convinta che la cosa che
          ti ho comprato fosse per il tuo compleanno, ma invece
          non è per oggi, quindi ti chiedo scusa se magari come
          regalo ti aspettavi un altra cosa ma dovrai aspettare
          un altro po. Tranquilla che arriva però.
        </p>

        <p>
          Detto questo ti auguro tanti auguri e di passare
          al meglio questo giorno, mi raccomando di non sbirciare
          cosa ce scritto in ogni pulsante.
        </p>

        <p>
          <strong>
            Ci sono sempre Fio, ricordalo.
          </strong>
        </p>

        <p>
          <strong>
            Ti amo tanto, il tuo Ale💙
          </strong>
        </p>

      </div>

    `;


  }


  /* ========================================
     PAGINE DELLE SITUAZIONI
     ======================================== */


  else {


    const pagina = contenuti[id];


    if (!pagina) {

      console.error("Pagina non trovata:", id);

      return;

    }


    detail.innerHTML = `

      <div class="detail-head">

        <button
          type="button"
          class="back"
          onclick="goHome()"
        >
          ← Indietro
        </button>

        <h2>
          ${pagina.titolo}
        </h2>

      </div>


      <div class="message">

        ${pagina.testo}


        <button
          type="button"
          class="love"
          onclick="sayLove(this)"
        >
          Ti amo 💙
        </button>

      </div>

    `;

  }


  /* Mostra la pagina */

  detail.classList.add("active");


  /* Torna in cima */

  window.scrollTo(0, 0);

}



/* ==========================================
   TORNA ALLA HOME
   ========================================== */


function goHome() {


  const home = document.getElementById("home");

  const detail = document.getElementById("detail");


  detail.classList.remove("active");

  home.classList.add("active");


  detail.innerHTML = "";


  window.scrollTo(0, 0);

}



/* ==========================================
   PULSANTE "TI AMO"
   ========================================== */


function sayLove(button) {


  button.textContent =
    "sono sempre qui, ricordalo 💙";

}


</script>


</body>

</html>
```
